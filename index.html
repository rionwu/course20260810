<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手作課程報名</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 全域基本字級調大 (15px -> 19px) */
  body { font-family: "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif; background: #faf8f5; color: #3d2b1f; font-size: 19px; padding: 20px 12px; }
  .page-header { text-align: center; padding: 12px 16px 24px; }
  /* 標題與副標題字級調大 */
  .page-title { font-size: 26px; font-weight: 700; color: #3d2b1f; letter-spacing: 2px; margin-bottom: 8px; }
  .page-sub { font-size: 18px; color: #8d6e63; line-height: 1.7; }

  .course-list { display: flex; flex-direction: column; gap: 20px; max-width: 520px; margin: 0 auto; }
  .course-card { background: #fffdf8; border: 1.5px solid #e8ddd4; border-radius: 16px; overflow: hidden; box-shadow: 0 2px 10px rgba(120,80,50,0.07); }
  .course-card.is-full { opacity: 0.7; }

  .card-header { padding: 18px 20px 14px; cursor: pointer; user-select: none; }
  .course-tag { display: inline-block; font-size: 14px; padding: 4px 12px; border-radius: 20px; margin-bottom: 8px; background: #e8f5e9; color: #388e3c; font-weight: 600; }
  .course-tag.full-tag { background: #fce4ec; color: #c62828; }

  .course-name { font-size: 22px; font-weight: 700; color: #3d2b1f; margin-bottom: 8px; }
  .course-meta { display: flex; flex-direction: column; gap: 6px; font-size: 16px; color: #6d4c41; margin-bottom: 10px; }
  .course-desc { font-size: 16px; color: #8d6e63; line-height: 1.7; margin-bottom: 12px; white-space: pre-line; }

  .quota-bar { margin-bottom: 4px; }
  .quota-label { display: flex; justify-content: space-between; font-size: 15px; color: #8d6e63; margin-bottom: 5px; }
  .bar-track { height: 9px; background: #ede0d4; border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; background: #81c784; }
  .bar-fill.warn { background: #ffb74d; }
  .bar-fill.full { background: #e57373; }

  .expand-hint { text-align: center; font-size: 15px; color: #bcaaa4; margin-top: 10px; }
  .card-form { display: none; padding: 0 20px 20px; border-top: 1px solid #ede0d4; }
  .card-form.open { display: block; }

  .form-title { font-size: 16px; color: #8d6e63; padding: 14px 0 12px; font-weight: 600; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 16px; color: #5d4037; margin-bottom: 6px; font-weight: 600; }
  .field input[type=text], .field select { width: 100%; padding: 12px 14px; border: 1.5px solid #d7ccc8; border-radius: 10px; font-size: 18px; background: #fffdf8; }

  .radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-opt { flex: 1; min-width: 90px; }
  .radio-opt input { display: none; }
  .radio-opt label { display: block; text-align: center; padding: 12px 8px; border: 1.5px solid #d7ccc8; border-radius: 10px; cursor: pointer; font-size: 17px; background: #fdf5ee; }
  .radio-opt input:checked + label { background: #e8f5e9; border-color: #81c784; color: #2e7d32; font-weight: 700; }

  .btn-submit { width: 100%; padding: 15px; background: #6d9e6a; color: #fff; border: none; border-radius: 10px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .success-block { display: none; padding: 20px; text-align: center; border-top: 1px solid #ede0d4; }
  .success-block.show { display: block; }
  .qrcode-img { width: 180px; height: 180px; border-radius: 8px; margin: 12px 0; }
  .line-btn { display: inline-block; background: #06c755; color: #fff; border-radius: 10px; padding: 12px 24px; text-decoration: none; font-weight: 700; font-size: 17px; }
  .loading { text-align: center; padding: 40px; color: #888; font-size: 18px; }

  /* 地點與地圖（置中樣式） */
  .store-info-box {
    max-width: 520px;
    margin: 30px auto 20px;
    padding: 20px;
    background: #fffdf8;
    border: 1.5px solid #e8ddd4;
    border-radius: 16px;
    box-shadow: 0 2px 10px rgba(120,80,50,0.07);
    text-align: center;
  }
  .store-title { font-size: 19px; font-weight: 700; color: #3d2b1f; margin-bottom: 8px; }
  .store-detail { font-size: 16px; color: #6d4c41; line-height: 1.6; margin-bottom: 12px; }
  .store-note {
    font-size: 16px; color: #d84315; font-weight: 600;
    background: #fbe9e7; padding: 10px 14px; border-radius: 8px;
    margin: 0 auto 15px; display: inline-block;
  }
  .map-container { width: 100%; border-radius: 12px; overflow: hidden; line-height: 0; }
  .map-container iframe { width: 100%; height: 260px; border: 0; }
</style>
</head>
<body>

<div id="app">
  <div class="loading">載入課程中⋯</div>
</div>

<div class="store-info-box">
  <div class="store-title">📍 上課地點資訊</div>
  <div class="store-detail">
    <strong>i99 景美店</strong><br>
    116 臺北市文山區景華里景美街 5 巷 8 號<br>
    （景美捷運站二號出口對面）
  </div>
  <div class="store-note">
    💡 上課位置：進門後直走白板區
  </div>
  <div class="map-container">
    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d28927.29515379629!2d121.52280142282352!3d25.003109597855403!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3442ab9cee87c68f%3A0x7a14015fbdb12f53!2zaTk5IENPRkZFRSDmma_nvo7lupc!5e0!3m2!1szh-TW!2stw!4v1783737254885!5m2!1szh-TW!2stw" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>

<script>
(function () {
  const API_URL = "https://script.google.com/macros/s/AKfycbx9xcDe67IYetRoBZ0UkEG4Rqx1YzUuEyx2EH8MXxzXILHzEjMD4ULv2koTnB7mOHVk/exec";
  const ref = new URLSearchParams(window.location.search).get('ref') || "";

  fetch(API_URL)
    .then(res => res.json())
    .then(data => renderAll(data))
    .catch(() => { document.getElementById('app').innerHTML = '<div class="loading">載入失敗，請重新整理</div>'; });

  function renderAll(courses) {
    const app = document.getElementById('app');
    app.innerHTML = `
      <div class="page-header">
        <div class="page-title">🌿 手作課程報名</div>
        <div class="page-sub">每堂課皆在i99景美店舉辦，歡迎帶家人朋友一起來！<br>場地費低消99元，飲料Bar無限暢飲</div>
      </div>
      <div class="course-list" id="courseList"></div>
    `;

    const list = document.getElementById('courseList');
    if (!courses || courses.length === 0) {
      list.innerHTML = '<div class="loading">目前無上架課程</div>';
      return;
    }

    courses.forEach(course => {
      const remaining = course.max - course.count;
      const pct = Math.round((course.count / course.max) * 100);
      const card = document.createElement('div');
      card.className = 'course-card' + (course.isFull ? ' is-full' : '');
      const fields = course.fields || [];
      
      // 處理多個時段的顯示與下拉選單
      const timeOptions = (course.dates || (course.date ? [course.date] : []));
      const timeDisplayStr = timeOptions.join('<br>⏰ ');

      card.innerHTML = `
        <div class="card-header" id="header-${course.id}">
          <div class="course-tag ${course.isFull ? 'full-tag' : ''}">${course.isFull ? '已額滿' : '公益課程'}</div>
          <div class="course-name">${escapeHtml(course.name)}</div>
          <div class="course-meta">
            <span>⏰ ${timeDisplayStr}</span>
            <span>📍 ${escapeHtml(course.location)}</span>
            <span>🪡 ${escapeHtml(course.fee)}</span>
          </div>
          <div class="course-desc">${formatText(course.desc)}</div>
          <div class="quota-bar">
            <div class="quota-label"><span>剩餘名額</span><span>${remaining} / ${course.max} 人</span></div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          </div>
          ${course.isFull ? '' : '<div class="expand-hint">▼ 點此展開報名</div>'}
        </div>

        ${course.isFull ? '<div style="padding:15px;text-align:center;color:#c62828;font-size:17px;">本期已額滿 🙏</div>' : `
          <div class="card-form" id="form-${course.id}">
            <div class="form-title">✏️ 填寫報名資料</div>
            <form id="innerForm-${course.id}">
              ${renderTimeSelectHtml(course.id, timeOptions)}
              ${renderFieldsHtml(course.id, fields)}
              <div class="field">
                <label style="color:#bcaaa4">邀請人</label>
                <input type="text" readonly value="${escapeHtml(ref)}" style="background:#f5f0eb;color:#bcaaa4">
              </div>
              <button type="button" class="btn-submit" id="btn-${course.id}">送出報名 →</button>
            </form>
          </div>
          <div class="success-block" id="success-${course.id}">
            <div style="font-size:40px">🎉</div>
            <div style="font-size:22px;font-weight:700;color:#388e3c">報名成功！</div>
            <p style="margin:10px 0;font-size:16px;color:#6d4c41">請加入 LINE 群組掌握最新消息</p>
            <img class="qrcode-img" src="${course.qrUrl}">
            <br>
            <a class="line-btn" href="${course.lineUrl}" target="_blank">點此加入 LINE 群組</a>
          </div>
        `}
      `;

      list.appendChild(card);

      if (!course.isFull) {
        document.getElementById('header-' + course.id).onclick = () => {
          document.getElementById('form-' + course.id).classList.toggle('open');
        };
        document.getElementById('btn-' + course.id).onclick = () => submitForm(course);
      }
    });
  }

  // 渲染上課時間選單
  function renderTimeSelectHtml(courseId, options) {
    if (!options || options.length === 0) return '';
    if (options.length === 1) {
      return `<div class="field"><label>選擇上課時間 *</label><input type="text" id="time_${courseId}" value="${escapeHtml(options[0])}" readonly style="background:#f5f0eb;"></div>`;
    }
    const optsHtml = options.map(opt => `<option value="${escapeHtml(opt)}">${escapeHtml(opt)}</option>`).join('');
    return `<div class="field"><label>選擇上課時間 *</label><select id="time_${courseId}">${optsHtml}</select></div>`;
  }

  function renderFieldsHtml(courseId, fields) {
    return fields.map((f, idx) => {
      const req = f.required ? ' *' : '';
      if (f.type === 'radio') {
        const opts = f.options || [];
        const optsHtml = opts.map((opt, oIdx) => `
          <div class="radio-opt">
            <input type="radio" name="f_${courseId}_${idx}" id="opt_${courseId}_${idx}_${oIdx}" value="${escapeHtml(opt)}">
            <label for="opt_${courseId}_${idx}_${oIdx}">${escapeHtml(opt)}</label>
          </div>
        `).join('');
        return `<div class="field"><label>${escapeHtml(f.label)}${req}</label><div class="radio-group">${optsHtml}</div></div>`;
      } else {
        return `<div class="field"><label>${escapeHtml(f.label)}${req}</label><input type="text" id="input_${courseId}_${idx}" placeholder="請輸入${escapeHtml(f.label)}"></div>`;
      }
    }).join('');
  }

  function submitForm(course) {
    const fields = course.fields || [];
    const answers = {};

    // 取得選擇的課程時間
    const timeEl = document.getElementById(`time_${course.id}`);
    if (timeEl) {
      answers["上課時間"] = timeEl.value;
    }

    for (let i = 0; i < fields.length; i++) {
      const f = fields[i];
      let val = "";
      if (f.type === 'radio') {
        const checked = document.querySelector(`input[name="f_${course.id}_${i}"]:checked`);
        if (checked) val = checked.value;
      } else {
        val = document.getElementById(`input_${course.id}_${i}`).value.trim();
      }

      if (f.required && !val) {
        alert(`請填寫/選擇「${f.label}」`);
        return;
      }
      answers[f.label] = val;
    }

    const btn = document.getElementById('btn-' + course.id);
    btn.disabled = true;
    btn.textContent = '送出中...';

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        courseId: course.id,
        formAnswers: answers,
        ref: ref
      })
    })
      .then(res => res.json())
      .then(res => {
        if (!res.success && res.reason === 'full') {
          alert('瞬間名額已額滿');
          location.reload();
          return;
        }
        if (res.success) {
          document.getElementById('form-' + course.id).style.display = 'none';
          document.getElementById('success-' + course.id).classList.add('show');
        } else {
          alert('送出失敗，請重試');
          btn.disabled = false;
        }
      });
  }

  function escapeHtml(str) {
    if (!str) return '';
    const div = document.createElement('div'); div.textContent = str; return div.innerHTML;
  }

  function formatText(str) {
    if (!str) return '';
    let clean = escapeHtml(str);
    return clean.replace(/<br\s*\/?>/gi, '<br>').replace(/\n/g, '<br>');
  }
})();
</script>
</body>
</html>
